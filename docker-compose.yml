version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: drawgon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccwp
      POSTGRES_USER: ccwp
      POSTGRES_PASSWORD: ccwp_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
